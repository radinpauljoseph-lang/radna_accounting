[test.database]
    connection_string=sqlite:///temp_state.db
    schema=null

[local]
    url = http://localhost:8000
    approval_via_upload_enabled = false

[local.database]
    connection_string=postgresql+psycopg2://postgres:Password1@localhost:5432/postgres
    host = localhost
    port = 5432
    user = postgres
    password = Password1
    name = postgres
    schema=radna_db

[local.company]
    company_name = Radna Test Accounting
[local.report]
    journal_voucher_template_name = journal_voucher_template.html

    journal_voucher_folder_name = journal_vouchers
    journal_voucher_folder_path = C:\radna_accounting\reports

    journal_voucher_file_type = pdf


[dlocal]
    url = http://host.docker.internal:8000
    approval_via_upload_enabled = false

[dlocal.database]
    connection_string=postgresql+psycopg2://postgres:Password1@host.docker.internal:5432/postgres
    host = host.docker.internal
    port = 5432
    user = postgres
    password = Password1
    name = postgres
    schema=radna_db

[dlocal.company]
    company_name = Radna Docker Accounting
[dlocal.report]
    journal_voucher_template_name = journal_voucher_template.html

    journal_voucher_folder_name = journal_vouchers
    journal_voucher_folder_path = /app/reports

    journal_voucher_file_type = pdf

